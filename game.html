function nextWave(){
 wv++;const last=wv==WN();
 En=[];const n=last?1:Math.min(wv+1,4);
 for(let i=0;i<n;i++)En.push({ic:st.mi,n:'手下',el:st.el,r:st.r,mhp:300*H()*(1+.1*(wv-1)),hp:300*H()*(1+.1*(wv-1)),atk:22*AM()*(1+.05*(wv-1)),df:.1,iv:2.2,t:Math.random()*2});
 if(last){const b=CH[st.boss];En.unshift({ic:b.ic,n:b.n,el:b.el,r:b.r,mhp:b.hp*3*df.h,hp:b.hp*3*df.h,atk:b.atk*.4*df.a,df:.2,iv:2.5,t:0,boss:1})}
 tgtI=null;$('wv').textContent=`WAVE ${wv}/${WN()}`+(last?'  BOSS!':'');
 $('ens').innerHTML=En.map((e,i)=>`<div class="en ${e.boss?'b':''}" id="e${i}" onclick="tgtI=${i};fx()"><div class="ic">${e.ic}</div><div class="mu">${EI[e.el]}${e.n}</div><div class="hb"><i id="eh${i}"></i></div></div>`).join('');
 say(last?'ボスが現れた！':`WAVE ${wv} 開始`);wait=0;
}
let wait=0;
const fx=()=>En.forEach((e,i)=>{const d=$('e'+i);d&&d.classList.toggle('f',tgtI==i)});
function say(t){$('msg').textContent=t}
const alive=a=>a.filter(x=>x.hp>0);
const tgt=()=>{const l=alive(En);return En[tgtI]&&En[tgtI].hp>0?En[tgtI]:l[0]};
function fl(i,txt){const d=$('e'+i);if(!d)return;const f=document.createElement('div');f.className='fl';f.textContent=txt;d.appendChild(f);setTimeout(()=>f.remove(),700)}
function dmg(u,t,m){let v=u.atk*m*(u.bf>0?1.6:1)*emul(u.el,t.el)*(1-t.df)*(.9+Math.random()*.2);
 u.ab.forEach((a,i)=>{});const a=u.ab;if(a[1]=='el'&&a[2]==t.el||a[1]=='race'&&a[2]==t.r)v*=a[3];return Math.round(v)}
function hit(u,t,v){t.hp-=v;fl(En.indexOf(t),v);u.ul=Math.min(100,u.ul+4)}
function use(i,k){
 const u=A[i];if(over||u.hp<=0)return;const t=tgt();if(!t)return;
 if(k==0){if(u.sk>0)return;u.sk=u.c.sk[2];const y=u.c.sk[1];
  if(y=='dmg')hit(u,t,dmg(u,t,3.2));
  if(y=='aoe')alive(En).forEach(e=>hit(u,e,dmg(u,e,1.8)));
  if(y=='heal')alive(A).forEach(a=>a.hp=Math.min(a.mhp,a.hp+a.mhp*.3));
  if(y=='buff')A.forEach(a=>a.bf=8);
  if(y=='guard')A.forEach(a=>a.gd=6);
  say(`${u.n}「${u.c.sk[0]}」`)}
 else{if(u.ul<100)return;u.ul=0;const y=u.c.ul[1];
  if(y=='ubig')hit(u,t,dmg(u,t,9));
  if(y=='uaoe')alive(En).forEach(e=>hit(u,e,dmg(u,e,3.5)));
  if(y=='uheal')alive(A).forEach(a=>a.hp=Math.min(a.mhp,a.hp+a.mhp*.6));
  say(`${u.n}「${u.c.ul[0]}」！！`)}
 upd();
}
function tick(){
 if(over)return;const dt=.1;gt+=dt;
 if(wait>0){wait-=dt;if(wait<=0)nextWave();upd();return}
 if(st.g.includes('p')){ptim+=dt;if(ptim>=3){ptim=0;alive(A).forEach(a=>{if(a.ab[1]!='poison')a.hp-=a.mhp*.04})}}
 if(st.g.includes('r')){rtim+=dt;if(rtim>=2){rtim=0;if(!alive(A).some(a=>a.ab[1]=='regen'))alive(En).forEach(e=>e.hp=Math.min(e.mhp,e.hp+e.mhp*.04))}}
 alive(A).forEach(u=>{u.sk=Math.max(0,u.sk-dt);u.bf-=dt;u.gd-=dt;u.t+=dt;
  if(u.t>=u.iv){u.t=0;const t=tgt();if(!t)return;
   if(u.c.at=='splash')alive(En).forEach(e=>hit(u,e,dmg(u,e,u.pm)));else hit(u,t,dmg(u,t,u.pm))}});
 alive(En).forEach(e=>{e.t+=dt;if(e.t>=e.iv){e.t=0;const l=alive(A),a=l[Math.random()*l.length|0];
  a.hp-=Math.round(e.atk*emul(e.el,a.el)*(1-a.df)*(a.gd>0?.5:1));a.ul=Math.min(100,a.ul+3)}});
 upd();
 if(A.some(a=>a.hp<=0)){end(0);return}
 if(!alive(En).length){if(wv>=WN())bossDown();else{wait=1.6;banner('WAVE CLEAR!');$('ens').classList.add('out')}}
}
function upd(){
 A.forEach((u,i)=>{const c=$('c'+i);if(!c)return;c.classList.toggle('d',u.hp<=0);
  $('h'+i).style.width=Math.max(0,u.hp/u.mhp*100)+'%';$('u'+i).style.width=u.ul+'%';
  const s=$('s'+i);s.textContent=u.sk>0?`${u.c.sk[0]} ${Math.ceil(u.sk)}s`:u.c.sk[0];s.disabled=u.sk>0||u.hp<=0;
  const x=$('x'+i);x.className=u.ul>=100?'rd':'';x.disabled=u.ul<100||u.hp<=0});
 En.forEach((e,i)=>{const h=$('eh'+i);if(h)h.style.width=Math.max(0,e.hp/e.mhp*100)+'%';const d=$('e'+i);if(d&&e.hp<=0)d.style.opacity=.15});
}
function end(win){

 app.innerHTML=`<div class="pg">${h}<div class="row"><button class="p" onclick="home()">ホームへ</button><button onclick="showForm(cs,cd)">再挑戦</button></div></div>`;
}
